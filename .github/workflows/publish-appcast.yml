name: Sparkle-Appcast veröffentlichen

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Bereits veröffentlichtes Release-Tag, zum Beispiel v1.19.0
        required: true
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: sparkle-appcast
  cancel-in-progress: false

jobs:
  appcast:
    runs-on: macos-15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # Der private Sparkle-Schlüssel steht bewusst NICHT hier. Alles in `env`
    # eines Jobs liegt in der Prozessumgebung JEDES Schritts — auch der
    # fremden `uses:`-Actions. Der Schlüssel ist der langlebige
    # Vertrauensanker für Fastra-Updates; wer ihn liest, kann beliebige
    # Archive gültig signieren. Er hängt deshalb nur am Signierschritt.
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}

    steps:
      # Fremde Actions sind auf den vollständigen Commit fixiert, nicht auf
      # ein Hauptversions-Tag. Ein Tag lässt sich verschieben; ein Commit
      # nicht. Der Kommentar nennt die Version, damit ein bewusstes Update
      # lesbar bleibt.
      - name: Quelltext auschecken
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: GitHub Pages vorbereiten
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - name: Release-DMG und Release Notes laden
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p update site
          gh release download "$RELEASE_TAG" --pattern '*.dmg' --dir update

          shopt -s nullglob
          dmgs=(update/*.dmg)
          if (( ${#dmgs[@]} != 1 )); then
            echo "FEHLER: Release $RELEASE_TAG muss genau ein DMG enthalten." >&2
            exit 1
          fi

          # Gleicher Basisname: generate_appcast ordnet die Markdown-Datei dem DMG zu.
          gh release view "$RELEASE_TAG" --json body --jq .body > "${dmgs[0]%.dmg}.md"

      # Der Sparkle-Schlüssel darf nur ein Release autorisieren, dessen von
      # Apple bestätigtes DMG tatsächlich die erwartete Fastra-Version enthält.
      # Diese Prüfung läuft vor dem Laden des Signierwerkzeugs und ohne Secret.
      - name: Release-DMG vor Appcast prüfen
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          dmgs=(update/*.dmg)
          if (( ${#dmgs[@]} != 1 )); then
            echo "FEHLER: Es muss genau ein Release-DMG vorliegen." >&2
            exit 1
          fi
          dmg="${dmgs[0]}"

          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "FEHLER: Ungültiges Release-Tag: $RELEASE_TAG" >&2
            exit 1
          fi
          expected_version="${RELEASE_TAG#v}"
          if [[ "$(basename "$dmg")" != "Fastra-${expected_version}.dmg" ]]; then
            echo "FEHLER: DMG-Dateiname passt nicht zu $RELEASE_TAG." >&2
            exit 1
          fi

          # Ticket und Signatur des Transportcontainers prüfen, bevor sein
          # Inhalt überhaupt gemountet wird.
          xcrun stapler validate "$dmg"
          codesign --verify --strict --verbose=2 "$dmg"

          mount_dir="$(mktemp -d)"
          cleanup() {
            status=$?
            trap - EXIT
            hdiutil detach "$mount_dir" -quiet 2>/dev/null || true
            rm -rf "$mount_dir"
            exit "$status"
          }
          trap cleanup EXIT
          trap 'exit 130' INT
          trap 'exit 143' TERM

          hdiutil attach "$dmg" -readonly -nobrowse -mountpoint "$mount_dir" >/dev/null
          apps=("$mount_dir"/*.app)
          if (( ${#apps[@]} != 1 )) || [[ "$(basename "${apps[0]}")" != "Fastra.app" ]]; then
            echo "FEHLER: DMG muss genau Fastra.app enthalten." >&2
            exit 1
          fi
          app="${apps[0]}"
          if [[ -L "$app" ]]; then
            echo "FEHLER: Fastra.app im DMG darf kein symbolischer Link sein." >&2
            exit 1
          fi

          codesign --verify --deep --strict --verbose=2 "$app"
          spctl --assess --type execute --verbose=2 "$app"
          identifier="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Contents/Info.plist")"
          version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Contents/Info.plist")"
          if [[ "$identifier" != "de.dm0.fastra" ]]; then
            echo "FEHLER: Unerwartete Bundle-ID im Release-DMG." >&2
            exit 1
          fi
          if [[ "$version" != "$expected_version" ]]; then
            echo "FEHLER: App-Version $version passt nicht zu $RELEASE_TAG." >&2
            exit 1
          fi

      # Bewusst ein eigener Schritt OHNE das Secret: Das Auflösen der
      # Abhängigkeiten lädt fremden Code (SwiftPM-Pakete, Sparkles
      # Werkzeug-Artefakt) und darf den privaten Schlüssel deshalb nicht in
      # seiner Umgebung finden.
      - name: Signierwerkzeug bereitstellen
        shell: bash
        run: |
          set -euo pipefail
          swift package --package-path app resolve
          tool="$(find app/.build/artifacts/sparkle -type f -name generate_appcast -print -quit)"
          if [[ -z "$tool" ]]; then
            echo "FEHLER: Sparkles generate_appcast wurde nicht gefunden." >&2
            exit 1
          fi
          echo "SPARKLE_TOOL=$tool" >> "$GITHUB_ENV"

      - name: Signierten Appcast erzeugen
        shell: bash
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "$SPARKLE_PRIVATE_KEY" ]]; then
            echo "FEHLER: GitHub-Secret SPARKLE_PRIVATE_KEY fehlt." >&2
            exit 1
          fi
          tool="$SPARKLE_TOOL"

          # Der geheime Schlüssel steht weder in argv noch in einer Datei oder im Log.
          printf '%s' "$SPARKLE_PRIVATE_KEY" | "$tool" \
            --ed-key-file - \
            --embed-release-notes \
            --maximum-versions 1 \
            --maximum-deltas 0 \
            --download-url-prefix "https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/" \
            --link "https://github.com/${GITHUB_REPOSITORY}" \
            -o "$PWD/site/appcast.xml" \
            "$PWD/update"

          xmllint --noout site/appcast.xml

      # Der Artefaktname enthält die Versuchsnummer, damit „Re-run jobs“ keine
      # mehrdeutigen `github-pages`-Artefakte erzeugt. Der Deploy-Schritt verwendet
      # denselben Namen.
      - name: Pages-Artefakt hochladen
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          name: github-pages-${{ github.run_attempt }}
          path: site

      # `deploy-pages` begrenzt seine Wartezeit auf zehn Minuten. Nach einem
      # Timeout bleibt das Deployment derselben Commit-SHA abgebrochen; ein
      # weiterer Versuch im selben Lauf kann diesen Zustand nicht aufheben.
      # Bei einem Rückstau in Pages später einen neuen Lauf starten:
      # `gh workflow run publish-appcast.yml -f tag=v<version>`. Bis dahin bleibt
      # das zuletzt erfolgreich veröffentlichte Update verfügbar.
      - name: Appcast auf GitHub Pages veröffentlichen
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
