name: Sparkle-Appcast veröffentlichen

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Bereits veröffentlichtes Release-Tag, zum Beispiel v1.19.0
        required: true
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: sparkle-appcast
  cancel-in-progress: false

jobs:
  appcast:
    runs-on: macos-15
    environment:
      name: github-pages
      # Die Adresse kommt vom Anlauf, der wirklich veröffentlicht hat.
      url: ${{ steps.deployment.outputs.page_url || steps.deployment-retry.outputs.page_url }}
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
      SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}

    steps:
      - name: Quelltext auschecken
        uses: actions/checkout@v7

      - name: GitHub Pages vorbereiten
        uses: actions/configure-pages@v6

      - name: Release-DMG und Release Notes laden
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p update site
          gh release download "$RELEASE_TAG" --pattern '*.dmg' --dir update

          shopt -s nullglob
          dmgs=(update/*.dmg)
          if (( ${#dmgs[@]} != 1 )); then
            echo "FEHLER: Release $RELEASE_TAG muss genau ein DMG enthalten." >&2
            exit 1
          fi

          # Gleicher Basisname: generate_appcast ordnet die Markdown-Datei dem DMG zu.
          gh release view "$RELEASE_TAG" --json body --jq .body > "${dmgs[0]%.dmg}.md"

      - name: Signierten Appcast erzeugen
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$SPARKLE_PRIVATE_KEY" ]]; then
            echo "FEHLER: GitHub-Secret SPARKLE_PRIVATE_KEY fehlt." >&2
            exit 1
          fi

          swift package --package-path app resolve
          tool="$(find app/.build/artifacts/sparkle -type f -name generate_appcast -print -quit)"
          if [[ -z "$tool" ]]; then
            echo "FEHLER: Sparkles generate_appcast wurde nicht gefunden." >&2
            exit 1
          fi

          # Der geheime Schlüssel steht weder in argv noch in einer Datei oder im Log.
          printf '%s' "$SPARKLE_PRIVATE_KEY" | "$tool" \
            --ed-key-file - \
            --embed-release-notes \
            --maximum-versions 1 \
            --maximum-deltas 0 \
            --download-url-prefix "https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/" \
            --link "https://github.com/${GITHUB_REPOSITORY}" \
            -o "$PWD/site/appcast.xml" \
            "$PWD/update"

          xmllint --noout site/appcast.xml

      # Der Artefaktname trägt die Versuchsnummer des Laufs. Beim Wiederholen
      # eines Laufs („Re-run jobs") läuft dieser Schritt erneut, und ein
      # gleichnamiges Artefakt aus dem ersten Versuch bleibt daneben bestehen:
      # `deploy-pages` fand dann zwei Artefakte namens `github-pages` und brach
      # ab, statt zu veröffentlichen (am 2026-08-06 beim Release 1.63.0
      # aufgetreten). Mit der Versuchsnummer bekommt jeder Versuch seinen
      # eigenen Namen, und der Deploy-Schritt bekommt denselben ausdrücklich
      # genannt.
      - name: Pages-Artefakt hochladen
        uses: actions/upload-pages-artifact@v5
        with:
          name: github-pages-${{ github.run_attempt }}
          path: site

      # Zwei Anläufe statt einer längeren Frist: `deploy-pages` deckelt seine
      # `timeout`-Eingabe hart bei 10 Minuten („timeout set to the maximum of
      # 600000 milliseconds", am 2026-08-06 im Lauf mit 30 Minuten belegt). Die
      # Frist begrenzt dabei nicht die eigene Arbeit, sondern das Warten auf
      # GitHubs Pages-Warteschlange — die stand an diesem Tag zweimal über
      # 10 Minuten auf `deployment_queued`, während der Feed längst erzeugt und
      # signiert war. Der erste Anlauf darf deshalb scheitern, ohne den Lauf zu
      # beenden; der zweite veröffentlicht dasselbe Artefakt.
      - name: Appcast auf GitHub Pages veröffentlichen
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages-${{ github.run_attempt }}

      # Pause vor dem zweiten Anlauf: Ein Fristablauf bricht das Deployment ab,
      # und dessen Kennung entspricht der Commit-SHA. Ohne Pause bekam der
      # unmittelbar folgende Anlauf desselben Commits genau diesen
      # abgebrochenen Zustand zurückgemeldet und gab sofort auf.
      - name: Vor dem zweiten Anlauf warten
        if: steps.deployment.outcome == 'failure'
        shell: bash
        run: sleep 60

      - name: Appcast auf GitHub Pages veröffentlichen (zweiter Anlauf)
        id: deployment-retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
