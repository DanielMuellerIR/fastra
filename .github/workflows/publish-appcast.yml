name: Sparkle-Appcast veröffentlichen

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Bereits veröffentlichtes Release-Tag, zum Beispiel v1.19.0
        required: true
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: sparkle-appcast
  cancel-in-progress: false

jobs:
  appcast:
    runs-on: macos-15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # Der private Sparkle-Schlüssel steht bewusst NICHT hier. Alles in `env`
    # eines Jobs liegt in der Prozessumgebung JEDES Schritts — auch der
    # fremden `uses:`-Actions. Der Schlüssel ist der langlebige
    # Vertrauensanker für Fastra-Updates; wer ihn liest, kann beliebige
    # Archive gültig signieren. Er hängt deshalb nur am Signierschritt
    # (Review 2026-08-06).
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}

    steps:
      # Fremde Actions sind auf den vollständigen Commit fixiert, nicht auf
      # ein Hauptversions-Tag. Ein Tag lässt sich verschieben; ein Commit
      # nicht. Der Kommentar nennt die Version, damit ein bewusstes Update
      # lesbar bleibt (Review 2026-08-06).
      - name: Quelltext auschecken
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: GitHub Pages vorbereiten
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - name: Release-DMG und Release Notes laden
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p update site
          gh release download "$RELEASE_TAG" --pattern '*.dmg' --dir update

          shopt -s nullglob
          dmgs=(update/*.dmg)
          if (( ${#dmgs[@]} != 1 )); then
            echo "FEHLER: Release $RELEASE_TAG muss genau ein DMG enthalten." >&2
            exit 1
          fi

          # Gleicher Basisname: generate_appcast ordnet die Markdown-Datei dem DMG zu.
          gh release view "$RELEASE_TAG" --json body --jq .body > "${dmgs[0]%.dmg}.md"

      # Bewusst ein eigener Schritt OHNE das Secret: Das Auflösen der
      # Abhängigkeiten lädt fremden Code (SwiftPM-Pakete, Sparkles
      # Werkzeug-Artefakt) und darf den privaten Schlüssel deshalb nicht in
      # seiner Umgebung finden.
      - name: Signierwerkzeug bereitstellen
        shell: bash
        run: |
          set -euo pipefail
          swift package --package-path app resolve
          tool="$(find app/.build/artifacts/sparkle -type f -name generate_appcast -print -quit)"
          if [[ -z "$tool" ]]; then
            echo "FEHLER: Sparkles generate_appcast wurde nicht gefunden." >&2
            exit 1
          fi
          echo "SPARKLE_TOOL=$tool" >> "$GITHUB_ENV"

      - name: Signierten Appcast erzeugen
        shell: bash
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "$SPARKLE_PRIVATE_KEY" ]]; then
            echo "FEHLER: GitHub-Secret SPARKLE_PRIVATE_KEY fehlt." >&2
            exit 1
          fi
          tool="$SPARKLE_TOOL"

          # Der geheime Schlüssel steht weder in argv noch in einer Datei oder im Log.
          printf '%s' "$SPARKLE_PRIVATE_KEY" | "$tool" \
            --ed-key-file - \
            --embed-release-notes \
            --maximum-versions 1 \
            --maximum-deltas 0 \
            --download-url-prefix "https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/" \
            --link "https://github.com/${GITHUB_REPOSITORY}" \
            -o "$PWD/site/appcast.xml" \
            "$PWD/update"

          xmllint --noout site/appcast.xml

      # Der Artefaktname trägt die Versuchsnummer des Laufs. Beim Wiederholen
      # eines Laufs („Re-run jobs") läuft dieser Schritt erneut, und ein
      # gleichnamiges Artefakt aus dem ersten Versuch bleibt daneben bestehen:
      # `deploy-pages` fand dann zwei Artefakte namens `github-pages` und brach
      # ab, statt zu veröffentlichen (am 2026-08-06 beim Release 1.63.0
      # aufgetreten). Mit der Versuchsnummer bekommt jeder Versuch seinen
      # eigenen Namen, und der Deploy-Schritt bekommt denselben ausdrücklich
      # genannt.
      - name: Pages-Artefakt hochladen
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          name: github-pages-${{ github.run_attempt }}
          path: site

      # Ein Rückstau in GitHubs Pages-Warteschlange lässt sich in diesem Lauf
      # NICHT abfangen — das ist geprüft, nicht vermutet (2026-08-06):
      #
      #   • Eine längere Frist gibt es nicht. `deploy-pages` deckelt seine
      #     `timeout`-Eingabe hart und sagt es auch: „timeout value is greater
      #     than the allowed maximum - timeout set to the maximum of 600000
      #     milliseconds". Zehn Minuten sind das Ende.
      #   • Ein zweiter Anlauf im selben Lauf hilft nicht. Der Fristablauf
      #     bricht das Deployment ab, und dessen Kennung ist die Commit-SHA;
      #     der zweite Anlauf desselben Commits bekam den abgebrochenen Zustand
      #     zurückgemeldet und gab nach Sekunden auf — mit einer Minute Pause
      #     ebenso wie mit fünf.
      #
      # Bleibt der Lauf hier hängen, ist das kein Fehler am Feed: Er ist zu
      # diesem Zeitpunkt fertig erzeugt und signiert. Dann später einen FRISCHEN
      # Lauf starten (`gh workflow run publish-appcast.yml -f tag=v<version>`) —
      # nicht denselben wiederholen. Bis dahin liefert die Seite unverändert das
      # zuletzt erfolgreich veröffentlichte Update aus.
      - name: Appcast auf GitHub Pages veröffentlichen
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
