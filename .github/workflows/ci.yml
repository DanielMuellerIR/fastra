name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  swift-tests:
    name: Swift-Tests
    # Fastras aufgelöste Abhängigkeiten benötigen Swift 6.2. Xcode 26.6 ist
    # bewusst fest gewählt: Der noch aktive Runner-Default 26.5 kann den
    # SwiftPM-Testhelfer bei der seriellen Suite mit SIGSEGV beenden.
    runs-on: macos-26
    # Kalte Runner übersetzen App und isolierte Test-Sandbox getrennt.
    # Dafür muss nach dem Build noch Zeit für beide vollständigen Testphasen bleiben.
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v7

      - name: Gepinntes SwiftLint vorbereiten
        shell: bash
        run: |
          set -euo pipefail
          lint_dir="$(mktemp -d "$RUNNER_TEMP/fastra-swiftlint.XXXXXX")"
          archive="$lint_dir/portable_swiftlint.zip"
          curl --fail --location --silent --show-error \
            https://github.com/realm/SwiftLint/releases/download/0.65.1/portable_swiftlint.zip \
            --output "$archive"
          echo "c1e429b0599cf1b516f369a2d9ec04eaf0e436f3c12b637df8851fa52ff694d0  $archive" | shasum -a 256 --check
          unzip -q "$archive" -d "$lint_dir/tool"
          echo "SWIFTLINT_BIN=$lint_dir/tool/swiftlint" >> "$GITHUB_ENV"

      - name: SwiftLint-Gate und Werkzeugtests ausführen
        run: |
          python3 -m unittest discover -s app/Tests/Tooling -p test_swift_lint.py -v
          python3 app/swift-lint.py

      - name: Lokalisierungswerkzeug installieren
        run: brew install ripgrep

      - name: Abhängigkeiten vorbereiten und App bauen
        working-directory: app
        run: ./build.sh

      - name: Swift-Tests ausführen
        working-directory: app
        # Der gemeinsame Runner isoliert Temp-Dateien und Einstellungen.
        # Auf dem Hosted Runner bleibt auch die Kernphase seriell, damit
        # gemeinsame Worker-Pools und die Main-Queue nicht überlastet werden.
        run: ./test.sh --no-parallel

      - name: Lokalisierung prüfen
        working-directory: app
        run: ./localization-audit.sh
