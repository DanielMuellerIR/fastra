name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  swift-tests:
    name: Swift-Tests
    # Fastras aufgelöste Abhängigkeiten benötigen Swift 6.2. Xcode 26.6 ist
    # bewusst fest gewählt: Der noch aktive Runner-Default 26.5 kann den
    # SwiftPM-Testhelfer bei der seriellen Suite mit SIGSEGV beenden.
    runs-on: macos-26
    # Kalte Runner übersetzen App und isolierte Test-Sandbox getrennt.
    # Dafür muss nach dem Build noch Zeit für beide vollständigen Testphasen bleiben.
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v7

      - name: Lokalisierungswerkzeug installieren
        run: brew install ripgrep

      - name: Abhängigkeiten vorbereiten und App bauen
        working-directory: app
        run: ./build.sh

      - name: Swift-Tests ausführen
        working-directory: app
        # Der gemeinsame Runner isoliert Temp-Dateien und Einstellungen.
        # Auf dem Hosted Runner bleibt auch die Kernphase seriell, damit
        # gemeinsame Worker-Pools und die Main-Queue nicht überlastet werden.
        run: ./test.sh --no-parallel

      - name: Lokalisierung prüfen
        working-directory: app
        run: ./localization-audit.sh
