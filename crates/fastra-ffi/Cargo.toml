[package]
name = "fastra-ffi"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "fastra-bindgen"
path = "src/bin/fastra-bindgen.rs"
required-features = ["bindgen"]

[features]
bindgen = ["uniffi/cli"]

[dependencies]
fastra-core = { path = "../fastra-core" }
uniffi = "=0.31.2"
